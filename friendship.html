<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Special Friendship Wish ✨</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent; /* Mobile tap highlight removal */
        }

        body {
            background: linear-gradient(135deg, #ffdde1 0%, #ee9ca7 100%);
            min-height: 100vh;
            min-height: 100svh; /* Mobile viewport height fix */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            padding: 15px;
        }

        /* Floating Background Hearts */
        .floating-heart {
            position: absolute;
            font-size: 20px;
            color: rgba(255, 255, 255, 0.7);
            animation: float 6s infinite ease-in-out;
            pointer-events: none;
            bottom: -50px;
        }

        @keyframes float {
            0% { transform: translateY(0) scale(0.8); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-105vh) scale(1.2); opacity: 0; }
        }

        /* Container Card */
        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 25px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 100%;
            max-width: 380px;
            text-align: center;
            position: relative;
            z-index: 10;
            border: 2px solid #ffffff;
            transition: all 0.5s ease;
        }

        .page {
            display: none;
            animation: fadeIn 0.5s ease forwards;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            color: #d63031;
            font-size: 1.5rem;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #636e72;
            font-size: 0.9rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        /* Input Styling */
        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #ff7675;
            border-radius: 25px;
            outline: none;
            text-align: center;
            font-size: 0.95rem;
            margin-bottom: 15px;
            background: #ffffff;
            color: #2d3436;
        }

        /* Buttons */
        .btn {
            background: linear-gradient(45deg, #ff7675, #d63031);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(214, 48, 49, 0.3);
            transition: all 0.3s ease;
            width: 100%; /* Easy to click on mobile */
            max-width: 220px;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:disabled {
            background: #b2bec3;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* Postbox Animation */
        .postbox {
            font-size: 70px;
            cursor: pointer;
            display: inline-block;
            transition: transform 0.3s ease;
            margin: 10px 0;
            animation: bounce 2s infinite;
        }

        .postbox:active {
            transform: scale(1.1);
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-12px); }
            60% { transform: translateY(-5px); }
        }

        /* Final Letter Display */
        .letter-box {
            display: none;
            background: #fffdf9;
            border: 2px dashed #ff7675;
            padding: 18px 15px;
            border-radius: 15px;
            text-align: left;
            margin-top: 15px;
            box-shadow: inset 0
